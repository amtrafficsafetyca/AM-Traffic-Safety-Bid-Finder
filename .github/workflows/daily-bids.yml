name: AM Traffic Safety Daily Bids

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * 1-5"
      timezone: "America/Los_Angeles"

jobs:
  find-bids:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run AM Traffic Safety Bid Finder
        run: |
          python bid_finder.py

      - name: Save opportunity report
        uses: actions/upload-artifact@v4
        with:
          name: AM-Traffic-Safety-Report
          path: output/
          if-no-files-found: warn

      - name: Send report by Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from pathlib import Path
          from email.message import EmailMessage

          gmail_user = os.environ["GMAIL_USER"]
          gmail_password = os.environ["GMAIL_APP_PASSWORD"]

          html_file = Path("output/am_traffic_safety_report.html")
          csv_file = Path("output/am_traffic_safety_opportunities.csv")

          msg = EmailMessage()
          msg["Subject"] = "AM Traffic Safety – Daily Opportunity Report"
          msg["From"] = gmail_user
          msg["To"] = gmail_user

          msg.set_content(
              "Your AM Traffic Safety daily opportunity report is attached."
          )

          if html_file.exists():
              html = html_file.read_text(encoding="utf-8")
              msg.add_alternative(html, subtype="html")

          if csv_file.exists():
              msg.add_attachment(
                  csv_file.read_bytes(),
                  maintype="text",
                  subtype="csv",
                  filename=csv_file.name
              )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(gmail_user, gmail_password)
              smtp.send_message(msg)

          print("Report sent successfully.")
          PY
