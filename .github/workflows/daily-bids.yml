name: AM Traffic Safety Daily Bids

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * 1-5"
      timezone: "America/Los_Angeles"

jobs:
  find-bids:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run AM Traffic Safety Bid Finder
        run: |
          python bid_finder.py

      - name: Save opportunity report
        uses: actions/upload-artifact@v4
        with:
          name: AM-Traffic-Safety-Report
          path: output/
          if-no-files-found: warn
